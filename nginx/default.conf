limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Behind CloudFront: use the visitor IP that CloudFront appends to X-Forwarded-For,
  # so rate limiting applies per visitor rather than per CloudFront edge server.
  # Safe only because the EC2 security group allows port 80 from CloudFront alone.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;

  server_tokens off;
  client_max_body_size 1m;

  limit_req zone=perip burst=40 nodelay;
  limit_conn connperip 20;
  limit_req_status 429;
  limit_conn_status 429;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
